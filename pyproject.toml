[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextsqueeze"
version = "0.1.0"
description = "Lightweight LLM context compression and intelligent routing toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "ContextSqueeze Team"}
]
keywords = ["llm", "compression", "context", "ai", "token", "routing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "tiktoken>=0.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
proxy = [
    "uvicorn>=0.30",
    "starlette>=0.37",
]
all = [
    "contextsqueeze[dev,proxy]"
]

[project.scripts]
ctxsq = "contextsqueeze.cli:main"
contextsqueeze = "contextsqueeze.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/contextsqueeze"
Repository = "https://github.com/yourusername/contextsqueeze"
Issues = "https://github.com/yourusername/contextsqueeze/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/contextsqueeze"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=contextsqueeze --cov-report=term-missing"
